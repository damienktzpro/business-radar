<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Radar personnel de veille entrepreneuriale avec sources directes sélectionnées et confirmation multi-source." />
  <title>Business Radar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">VEILLE ENTREPRENEURIALE · V2.2</p>
      <h1>Business Radar</h1>
      <p id="updated" class="updated">Chargement…</p>
    </div>
    <button id="refresh" class="refresh" type="button" aria-label="Recharger les données affichées" title="Recharger">↻</button>
  </header>

  <main>
    <nav id="tabs" class="tabs" aria-label="Vues du radar">
      <button class="tab active" data-view="Pour toi">Pour toi</button>
      <button class="tab" data-view="France">France</button>
      <button class="tab" data-view="Nouveaux business">Nouveaux business</button>
      <button class="tab" data-view="Levées & M&A">Levées &amp; M&amp;A</button>
      <button class="tab" data-view="Europe">Europe</button>
      <button class="tab" data-view="Découverte">Découverte</button>
      <button class="tab" data-view="Favoris">Favoris</button>
    </nav>

    <section class="controls">
      <div>
        <p class="control-label">Secteurs</p>
        <div id="filters" class="filters"></div>
      </div>
      <label class="search-wrap">
        <span>Rechercher</span>
        <input id="search" type="search" placeholder="SaaS, IA, fintech…" autocomplete="off" />
      </label>
    </section>

    <section class="hero">
      <div class="hero-status">
        <span class="live-dot"></span>
        <span>RADAR ACTIF · SOURCES DIRECTES</span>
      </div>
      <strong id="counter">0 signal</strong>
    </section>

    <section id="stats" class="stats" aria-label="Statistiques du radar"></section>

    <section id="feed" class="feed" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>Aucun résultat avec ces filtres.</p>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <div class="source-line">
          <span class="source"></span>
          <span class="trust"></span>
          <span class="confidence"></span>
          <span class="age"></span>
        </div>
        <div class="score-wrap">
          <span class="interest"></span>
          <span class="score"></span>
        </div>
      </div>

      <h2></h2>
      <div class="tags"></div>

      <div class="insight-block">
        <span class="insight-label">RÉSUMÉ EN FRANÇAIS</span>
        <p class="summary"></p>
      </div>

      <div class="why-block">
        <span class="insight-label">POURQUOI C’EST INTÉRESSANT</span>
        <p class="why-text"></p>
      </div>

      <div class="confidence-note"></div>

      <details class="score-details">
        <summary>Pourquoi ce score ?</summary>
        <div class="score-reasons"></div>
      </details>

      <details class="source-excerpt-wrap">
        <summary>Voir l’extrait original</summary>
        <p class="source-excerpt"></p>
      </details>

      <div class="metrics"></div>

      <div class="card-actions" aria-label="Personnaliser le radar">
        <button class="action favorite" type="button">☆ Favori</button>
        <button class="action more" type="button">↑ Plus comme ça</button>
        <button class="action less" type="button">↓ Moins comme ça</button>
      </div>

      <a class="read" target="_blank" rel="noopener noreferrer">
        <span class="read-label">Voir la source</span><span>↗</span>
      </a>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
